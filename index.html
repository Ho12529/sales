<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales &amp; Invoices</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#16282c;--mute:#5d7075;--line:#d3dcdb;--brand:#0f766e;--onbrand:#fff;--warn:#b45309;--bad:#b91c1c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a1c;--card:#16262a;--ink:#e6efee;--mute:#93a8ab;--line:#2a3f43;--brand:#2dd4bf;--onbrand:#06201d;--warn:#fbbf24;--bad:#f87171;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);display:flex;flex-direction:column}
header{padding:14px 16px 6px;font-weight:700;font-size:20px}
main{flex:1;overflow-y:auto;padding:8px 16px 90px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:12px 2px;font:inherit;font-size:13px}
nav button.on{color:var(--brand);font-weight:700;box-shadow:inset 0 3px 0 var(--brand)}
label{display:block;margin:12px 0 4px;color:var(--mute);font-size:14px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
button.b{background:var(--brand);color:var(--onbrand);border:0;border-radius:8px;padding:11px 16px;font:inherit;font-weight:600}
button.g{background:none;color:var(--brand);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit}
button.r{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}.row>.fix{flex:none}
.wrap{flex-wrap:wrap}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.mute{color:var(--mute);font-size:14px}
.tot{font-size:22px;font-weight:700}
.tag{font-size:13px;font-weight:700}.s-Paid{color:var(--brand)}.s-Part{color:var(--warn)}.s-Unpaid{color:var(--bad)}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 14px;font:inherit;font-size:14px}
.chip.on{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.pi{cursor:pointer}.pi.sel{background:var(--bg);box-shadow:inset 4px 0 0 var(--brand);padding-left:8px}
#picker{display:none;position:fixed;inset:0;background:var(--bg);z-index:6;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#modal{display:none;position:fixed;inset:0;background:var(--bg);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 24px;z-index:5}
#inv{background:#fff;color:#111;border-radius:10px;padding:18px;margin:12px 0}
#inv table{width:100%;border-collapse:collapse;margin:12px 0}
#inv th{text-align:left;border-bottom:2px solid #111;padding:6px 0;font-size:14px}
#inv td{padding:6px 0;border-bottom:1px solid #ddd;vertical-align:top}
#inv .n{text-align:right;white-space:nowrap;padding-left:8px}
#inv .s{display:flex;justify-content:space-between;padding:3px 0}
@media print{body>*:not(#modal){display:none!important}#modal{position:static;display:block!important;padding:0;background:#fff}.noprint{display:none!important}#inv{margin:0;padding:0}}
</style>
</head>
<body>
<header id="title">Sales</header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modal"></div>
<div id="picker"></div>
<input type="file" id="restore" accept=".json,application/json" hidden>

<script>
"use strict";
/* ---------- Storage (IndexedDB, on this phone only) ---------- */
const DB={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open("salesdb",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async get(k,d){const db=await this.open();return new Promise(res=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result===undefined?d:q.result);q.onerror=()=>res(d)})},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
};
const S={products:[],invoices:[],settings:{name:"My Shop",info:"",bank:"",cur:"$",tax:0,next:1}};
const newDraft=()=>({cust:"",phone:"",disc:"",paid:"",method:"Cash",due:"",note:""});
let tab="sell",cart=[],draft=newDraft(),invF="all",invQ="",CL=[];
const save=()=>Promise.all([DB.set("products",S.products),DB.set("invoices",S.invoices),DB.set("settings",S.settings)]);
let selId="",pq="",pcat="",prodQ="",editId="",CATS=[];
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

/* ---------- Helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>S.settings.cur+(+n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const dstr=iso=>new Date(iso).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
const isToday=iso=>new Date(iso).toDateString()===new Date().toDateString();
const pad=n=>String(n).padStart(4,"0");
const totals=(items,disc)=>{const sub=items.reduce((a,i)=>a+i.p*i.q,0),d=Math.min(+disc||0,sub),after=sub-d,tax=after*(+S.settings.tax||0)/100;return{sub,disc:d,tax,total:after+tax}};
const paidOf=i=>i.payments.reduce((a,p)=>a+p.amt,0);
const balOf=i=>Math.max(0,i.total-paidOf(i));
const statusOf=i=>balOf(i)<0.005?"Paid":paidOf(i)>0?"Part paid":"Unpaid";
const sCls=s=>"s-"+s.split(" ")[0];
function migP(p){p.perCarton=+p.perCarton||12;p.dozPrice=p.dozPrice??"";p.cartPrice=p.cartPrice??"";return p}
function unitInfo(p,un){
  if(un==="12")return{unit:"Dozen",u:12,p:p.dozPrice!==""?+p.dozPrice:p.price*12};
  if(un==="C"){const n=+p.perCarton||1;return{unit:"Carton",u:n,p:p.cartPrice!==""?+p.cartPrice:p.price*n}}
  return{unit:"Piece",u:1,p:p.price};
}
const ulabel=i=>i.u>1?`${i.unit.toLowerCase()} of ${i.u}`:"pc";
const lineDesc=x=>x.u>1?`<div style="font-size:12px;color:#555">${x.unit} of ${x.u} pcs · ${x.q*x.u} pcs total</div>`:"";
let PK={sel:{},q:"",cat:"",only:false,cnt:{},cats:[]};
function openPicker(){
  const cnt={};S.invoices.forEach(i=>i.items.forEach(x=>{if(x.id)cnt[x.id]=(cnt[x.id]||0)+x.q*(x.u||1)}));
  PK={sel:{},q:"",cat:"",only:false,cnt,cats:[]};
  $("picker").innerHTML=`<div class="row" style="padding:12px 16px 0"><button class="g fix" onclick="closePicker()">Cancel</button><b style="text-align:center">Select products</b><span class="fix" style="width:72px"></span></div>
  <div style="padding:8px 16px 0"><input id="pks" type="search" placeholder="Search name, code or category…" oninput="PK.q=this.value;pkList()"><div class="chips" id="pkc"></div></div>
  <div id="pkl" style="flex:1;overflow-y:auto;padding:0 16px 12px"></div>
  <div id="pkb" style="padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)"></div>`;
  $("picker").style.display="flex";pkChips();pkList();pkBar();
}
function closePicker(){$("picker").style.display="none"}
function pkChips(){
  PK.cats=[...new Set(S.products.map(p=>p.cat).filter(Boolean))].sort();
  const n=Object.keys(PK.sel).length;
  $("pkc").innerHTML=`<button class="chip ${PK.only?"on":""}" onclick="PK.only=!PK.only;pkChips();pkList()">✓ Selected (${n})</button><button class="chip ${PK.cat?"":"on"}" onclick="PK.cat='';pkChips();pkList()">All</button>`+
    PK.cats.map((c,x)=>`<button class="chip ${PK.cat===c?"on":""}" onclick="PK.cat=PK.cats[${x}];pkChips();pkList()">${esc(c)}</button>`).join("");
}
function pkLine(id){const p=S.products.find(x=>x.id===id),s=PK.sel[id],w=unitInfo(p,s.unit);return{total:w.p*s.q,pcs:w.u*s.q}}
function pkList(){
  const q=PK.q.toLowerCase().trim();
  const l=S.products.filter(p=>(!PK.only||PK.sel[p.id])&&(!PK.cat||p.cat===PK.cat)&&(!q||[p.name,p.code,p.cat].some(s=>String(s||"").toLowerCase().includes(q))))
    .sort((a,b)=>(PK.cnt[b.id]||0)-(PK.cnt[a.id]||0)||a.name.localeCompare(b.name));
  $("pkl").innerHTML=l.length?l.map(p=>{const s=PK.sel[p.id],tag=[p.code,p.cat].filter(Boolean).join(" · ");
    return `<div class="box" style="margin:6px 0;padding:10px"><div class="row" style="gap:12px;cursor:pointer" onclick="pkTick('${p.id}')">
    <input type="checkbox" class="fix" style="width:24px;height:24px;pointer-events:none" ${s?"checked":""}>
    <div>${esc(p.name)}<div class="mute">${tag?esc(tag)+" · ":""}${fmt(p.price)} / pc${p.stock===""?"":" · "+(p.stock<=0?"out of stock":p.stock+" pcs")}</div></div></div>
    ${s?`<div class="row" style="margin-top:8px"><select onchange="pkUnit('${p.id}',this.value)">${[["1","Piece"],["12","Dozen (12)"],["C","Carton ("+p.perCarton+")"]].map(([v,t])=>`<option value="${v}" ${s.unit===v?"selected":""}>${t}</option>`).join("")}</select>
    <input class="fix" type="number" inputmode="decimal" min="0" step="any" value="${s.q}" style="width:80px" oninput="pkQty('${p.id}',this.value)">
    <b class="fix" id="lt_${p.id}" style="min-width:90px;text-align:right">${fmt(pkLine(p.id).total)}</b></div>`:""}</div>`}).join(""):`<div class="empty">${S.products.length?"No product matches.":"No products yet. Add them in the Products tab."}</div>`;
}
function pkTick(id){if(PK.sel[id])delete PK.sel[id];else PK.sel[id]={unit:"1",q:1};pkChips();pkList();pkBar()}
function pkUnit(id,v){PK.sel[id].unit=v;$("lt_"+id).textContent=fmt(pkLine(id).total);pkBar()}
function pkQty(id,v){PK.sel[id].q=parseFloat(v)||0;$("lt_"+id).textContent=fmt(pkLine(id).total);pkBar()}
function pkBar(){
  const ids=Object.keys(PK.sel);let pcs=0,tot=0;ids.forEach(id=>{const l=pkLine(id);pcs+=l.pcs;tot+=l.total});
  $("pkb").innerHTML=`<div class="row"><div><b>${ids.length} selected</b><div class="mute">${pcs} pcs · ${fmt(tot)}</div></div>
  <button class="g fix" onclick="PK.sel={};pkChips();pkList();pkBar()">Clear</button><button class="b fix" onclick="pkAdd()" ${ids.length?"":"disabled"}>Add to invoice</button></div>`;
}
function pkAdd(){
  const ids=Object.keys(PK.sel).filter(id=>PK.sel[id].q>0);
  if(!ids.length){alert("Set a quantity above zero.");return}
  const low=[];
  ids.forEach(id=>{const p=S.products.find(x=>x.id===id),s=PK.sel[id],w=unitInfo(p,s.unit);
    const need=cart.filter(i=>i.id===id).reduce((a,i)=>a+i.q*i.u,0)+s.q*w.u;
    if(p.stock!==""&&need>p.stock)low.push(`${p.name} (stock ${p.stock} pcs)`)});
  if(low.length&&!confirm("Not enough stock for:\n"+low.join("\n")+"\n\nAdd anyway?"))return;
  ids.forEach(id=>{const p=S.products.find(x=>x.id===id),s=PK.sel[id],w=unitInfo(p,s.unit);
    const ex=cart.find(i=>i.id===id&&i.unit===w.unit);
    if(ex)ex.q+=s.q;else cart.push({id,n:p.name,unit:w.unit,u:w.u,p:w.p,q:s.q})});
  closePicker();render();
}
function mig(i){ // upgrade invoices saved by the first version
  if(!i.payments)i.payments=i.paid==="Paid"?[{amt:i.total,date:i.date,method:"Cash"}]:[];
  i.disc=i.disc||0;i.phone=i.phone||"";i.due=i.due||"";i.note=i.note||"";return i;
}

/* ---------- Views ---------- */
const TABS=[["sell","Sell"],["inv","Invoices"],["cust","Customers"],["prod","Products"],["set","Settings"]];
function render(){
  $("nav").innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
  $("title").textContent=S.settings.name;
  $("main").innerHTML=views[tab]();
}
function go(t){tab=t;if(t!=="prod")editId="";render();$("main").scrollTop=0}

function sumHtml(){
  const t=totals(cart,draft.disc),paid=Math.min(+draft.paid||0,t.total),bal=t.total-paid;
  return `<div class="li"><span>Subtotal</span><span>${fmt(t.sub)}</span></div>
  ${t.disc?`<div class="li"><span>Discount</span><span>−${fmt(t.disc)}</span></div>`:""}
  ${t.tax?`<div class="li"><span>Tax (${S.settings.tax}%)</span><span>${fmt(t.tax)}</span></div>`:""}
  <div class="li"><span class="tot">Total</span><span class="tot">${fmt(t.total)}</span></div>
  <div class="li"><span>Paid now</span><span>${fmt(paid)}</span></div>
  <div class="li"><b>Balance remaining</b><b class="${bal>0.005?"s-Unpaid":"s-Paid"}">${fmt(bal)}</b></div>`;
}
function upd(k,v){draft[k]=v;$("sumbox").innerHTML=sumHtml()}
function quickPay(f){const t=totals(cart,draft.disc);draft.paid=f?+(t.total*f).toFixed(2):"";render()}

const views={
sell(){
  const custs=[...new Set(S.invoices.map(i=>i.cust))].map(c=>`<option value="${esc(c)}">`).join("");
  const opts=S.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${fmt(p.price)})</option>`).join("");
  const M=["Cash","Transfer","Card","Other"];
  return `
  <div class="row"><div><label>Customer</label><input id="cust" list="cl" placeholder="Walk-in customer" value="${esc(draft.cust)}" oninput="draft.cust=this.value"></div>
  <div><label>Phone (with country code)</label><input type="tel" placeholder="optional" value="${esc(draft.phone)}" oninput="draft.phone=this.value"></div></div>
  <datalist id="cl">${custs}</datalist>
  <label>Items</label>
  <div class="row"><button class="b" onclick="openPicker()">＋ Choose products</button><button class="g" onclick="addCustom()">Custom item</button></div>
  <div class="box">${cart.length?cart.map((i,x)=>`<div class="li"><div>${esc(i.n)}<div class="mute">${ulabel(i)} @ ${fmt(i.p)}</div></div>
    <div style="text-align:right"><div class="row" style="gap:6px"><input class="fix" type="number" inputmode="decimal" min="0" step="any" style="width:72px" value="${i.q}" onchange="cartQty(${x},this.value)"><button class="g r fix" onclick="cart.splice(${x},1);render()">✕</button></div><b>${fmt(i.p*i.q)}</b></div></div>`).join(""):`<div class="empty">No items yet. Choose a product and tap Add.</div>`}</div>
  <label>Discount (amount)</label><input type="number" inputmode="decimal" step="any" value="${esc(draft.disc)}" oninput="upd('disc',this.value)">
  <label>Deposit / amount paid now</label>
  <input type="number" inputmode="decimal" step="any" placeholder="0" value="${esc(draft.paid)}" oninput="upd('paid',this.value)">
  <div class="chips"><button class="chip" onclick="quickPay(0)">No deposit</button><button class="chip" onclick="quickPay(.5)">50%</button><button class="chip" onclick="quickPay(1)">Pay in full</button></div>
  <div class="row"><div><label>Payment method</label><select onchange="draft.method=this.value">${M.map(m=>`<option ${m===draft.method?"selected":""}>${m}</option>`).join("")}</select></div>
  <div><label>Balance due date</label><input type="date" value="${esc(draft.due)}" onchange="draft.due=this.value"></div></div>
  <label>Note on invoice</label><input placeholder="optional" value="${esc(draft.note)}" oninput="draft.note=this.value">
  <div class="box" id="sumbox" style="margin-top:14px">${sumHtml()}</div>
  <button class="b" style="width:100%" onclick="saveInvoice()">Save invoice</button>`;
},
inv(){
  const A=S.invoices;
  if(!A.length)return `<div class="empty">No invoices yet. Make your first sale on the Sell tab.</div>`;
  const out=A.reduce((a,i)=>a+balOf(i),0);
  const ts=A.filter(i=>isToday(i.date)).reduce((a,i)=>a+i.total,0);
  const tc=A.flatMap(i=>i.payments).filter(p=>isToday(p.date)).reduce((a,p)=>a+p.amt,0);
  const F=[["all","All"],["Unpaid","Unpaid"],["Part paid","Part paid"],["Paid","Paid"]];
  return `<div class="box"><div class="row"><div><div class="mute">Sales today</div><b>${fmt(ts)}</b></div><div><div class="mute">Cash received today</div><b>${fmt(tc)}</b></div></div>
  <div class="li" style="margin-top:8px"><span>Total owed to you</span><b class="s-Unpaid">${fmt(out)}</b></div></div>
  <div class="chips">${F.map(([k,l])=>`<button class="chip ${invF===k?"on":""}" onclick="invF='${k}';render()">${l}</button>`).join("")}</div>
  <input placeholder="Search customer or invoice number" value="${esc(invQ)}" oninput="invQ=this.value;$('invlist').innerHTML=invList()">
  <div class="box" id="invlist">${invList()}</div>`;
},
cust(){
  const m={};
  S.invoices.forEach(i=>{const c=m[i.cust]||(m[i.cust]={n:i.cust,t:0,p:0,c:0});c.t+=i.total;c.p+=paidOf(i);c.c++});
  CL=Object.values(m).sort((a,b)=>(b.t-b.p)-(a.t-a.p));
  if(!CL.length)return `<div class="empty">Customers appear here after your first invoice.</div>`;
  return `<p class="mute">Sorted by who owes you the most. Tap a customer to see their invoices.</p><div class="box">`+
  CL.map((c,x)=>`<div class="li" onclick="custGo(${x})" style="cursor:pointer"><div>${esc(c.n)}<div class="mute">${c.c} invoice${c.c>1?"s":""} · bought ${fmt(c.t)}</div></div>
  <div style="text-align:right"><div class="tag ${c.t-c.p>0.005?"s-Unpaid":"s-Paid"}">${c.t-c.p>0.005?"Owes "+fmt(c.t-c.p):"Cleared"}</div></div></div>`).join("")+`</div>`;
},
prod(){
  const e=S.products.find(x=>x.id===editId)||{};
  const cats=[...new Set(S.products.map(p=>p.cat).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("");
  return `<div class="box"><b>${editId?"Edit product":"Add product"}</b>
  <label>Product name</label><input id="pn" value="${esc(e.name||"")}">
  <div class="row"><div><label>Code (optional)</label><input id="pcode" value="${esc(e.code||"")}"></div>
  <div><label>Category (optional)</label><input id="pcat" list="catl" value="${esc(e.cat||"")}"></div></div><datalist id="catl">${cats}</datalist>
  <div class="row"><div><label>Price per piece</label><input id="pp" type="number" inputmode="decimal" step="any" value="${e.price??""}"></div>
  <div><label>Pieces in a carton</label><input id="pc" type="number" inputmode="numeric" value="${e.perCarton??12}"></div></div>
  <div class="row"><div><label>Dozen price (optional)</label><input id="pd" type="number" inputmode="decimal" step="any" placeholder="auto: 12 × piece" value="${e.dozPrice??""}"></div>
  <div><label>Carton price (optional)</label><input id="pk" type="number" inputmode="decimal" step="any" placeholder="auto" value="${e.cartPrice??""}"></div></div>
  <label>Stock in pieces (optional)</label><input id="pst" type="number" inputmode="numeric" placeholder="Unlimited" value="${e.stock??""}">
  <p class="row"><button class="b" onclick="addProduct()">${editId?"Save changes":"Add product"}</button>${editId?`<button class="g" onclick="editId='';render()">Cancel</button>`:""}</p></div>
  <input type="search" placeholder="Search products…" value="${esc(prodQ)}" oninput="prodQ=this.value;$('prodlist').innerHTML=prodListHtml()">
  <div class="box" id="prodlist">${prodListHtml()}</div>`;
},
set(){const s=S.settings;return `
  <label>Business name</label><input value="${esc(s.name)}" onchange="S.settings.name=this.value;save();render()">
  <label>Address, phone, tax ID (shown on invoices)</label><textarea rows="3" onchange="S.settings.info=this.value;save()">${esc(s.info)}</textarea>
  <label>Bank / payment details (shown on invoices)</label><textarea rows="2" onchange="S.settings.bank=this.value;save()">${esc(s.bank)}</textarea>
  <div class="row"><div><label>Currency symbol</label><input value="${esc(s.cur)}" onchange="S.settings.cur=this.value;save()"></div>
  <div><label>Tax %</label><input type="number" inputmode="decimal" step="any" value="${s.tax}" onchange="S.settings.tax=+this.value||0;save()"></div>
  <div><label>Next invoice no.</label><input type="number" value="${s.next}" onchange="S.settings.next=+this.value||1;save()"></div></div>
  <div class="box"><b>Backup</b><p class="mute">Your data lives only on this phone. Save a backup file regularly and keep it in Drive, email, or WhatsApp.</p>
  <div class="row"><button class="b" onclick="backup()">Save backup</button><button class="g" onclick="$('restore').click()">Restore backup</button></div></div>`;}
};

function invList(){
  const q=invQ.toLowerCase();
  const l=S.invoices.slice().reverse().filter(i=>(invF==="all"||statusOf(i)===invF)&&(!q||i.cust.toLowerCase().includes(q)||pad(i.no).includes(q)));
  return l.length?l.map(i=>{const st=statusOf(i),b=balOf(i);return `<div class="li" onclick="showInv(${i.no})" style="cursor:pointer"><div>#${pad(i.no)} · ${esc(i.cust)}<div class="mute">${dstr(i.date)}${b>0&&i.due?" · due "+dstr(i.due):""}</div></div>
  <div style="text-align:right">${fmt(i.total)}<div class="tag ${sCls(st)}">${st}${b>0.005?" · owes "+fmt(b):""}</div></div></div>`}).join(""):`<div class="empty">No invoices match.</div>`;
}
function custGo(x){invQ=CL[x].n;invF="all";go("inv")}

/* ---------- Actions ---------- */
function addCustom(){
  const n=prompt("Item name");if(!n)return;
  const p=parseFloat(prompt("Price"));if(isNaN(p))return;
  const q=parseFloat(prompt("Quantity","1"))||1;
  cart.push({n,unit:"Piece",u:1,p,q});render();
}
function cartQty(x,v){const q=parseFloat(v);if(q>0)cart[x].q=q;render()}
async function saveInvoice(){
  if(!cart.length){alert("Add at least one item first.");return}
  const t=totals(cart,draft.disc),pay=Math.min(+draft.paid||0,t.total);
  const now=new Date().toISOString();
  const inv={no:S.settings.next++,date:now,cust:draft.cust.trim()||"Walk-in customer",phone:draft.phone.trim(),items:cart,sub:t.sub,disc:t.disc,tax:t.tax,taxRate:+S.settings.tax||0,total:t.total,
    due:draft.due,note:draft.note.trim(),payments:pay>0?[{amt:pay,date:now,method:draft.method}]:[]};
  cart.forEach(i=>{const p=S.products.find(x=>x.id===i.id);if(p&&p.stock!=="")p.stock=Math.max(0,p.stock-i.q*(i.u||1))});
  S.invoices.push(inv);cart=[];draft=newDraft();
  await save();render();showInv(inv.no);
}
function prodListHtml(){
  const q=prodQ.toLowerCase().trim();
  const l=S.products.filter(p=>!q||[p.name,p.code,p.cat].some(s=>String(s||"").toLowerCase().includes(q)));
  return l.length?l.map(p=>`<div class="li"><div>${esc(p.name)}<div class="mute">${esc([p.code,p.cat].filter(Boolean).join(" · "))}</div>
  <div class="mute">${fmt(p.price)} / pc · carton of ${p.perCarton}${p.dozPrice!==""?` · dozen ${fmt(p.dozPrice)}`:""}${p.cartPrice!==""?` · carton ${fmt(p.cartPrice)}`:""}</div>
  ${p.stock===""?"":`<div class="mute">Stock: ${p.stock} pcs (${Math.floor(p.stock/p.perCarton)} cartons + ${p.stock%p.perCarton} pcs)</div>`}</div>
  <div><button class="g" onclick="editProduct('${p.id}')">Edit</button> <button class="g r" onclick="delProduct('${p.id}')">Delete</button></div></div>`).join(""):`<div class="empty">${S.products.length?"No products match.":"No products yet. Add your first one above."}</div>`;
}
function addProduct(){
  const name=$("pn").value.trim(),price=parseFloat($("pp").value),st=$("pst").value;
  if(!name||isNaN(price)){alert("Enter a name and a price per piece.");return}
  const opt=id=>$(id).value===""?"":+$(id).value;
  const d={name,code:$("pcode").value.trim(),cat:$("pcat").value.trim(),price,perCarton:+$("pc").value||12,dozPrice:opt("pd"),cartPrice:opt("pk"),stock:st===""?"":+st};
  if(editId)Object.assign(S.products.find(x=>x.id===editId),d);else S.products.push({id:"p"+Date.now(),...d});
  editId="";save();render();
}
function editProduct(id){editId=id;render();$("main").scrollTop=0}
function delProduct(id){if(confirm("Delete this product? Past invoices are not affected.")){S.products=S.products.filter(p=>p.id!==id);save();render()}}

/* ---------- Invoice view & payments ---------- */
function showInv(no){
  const i=S.invoices.find(x=>x.no===no);if(!i)return;
  const s=S.settings,st=statusOf(i),b=balOf(i),paid=paidOf(i);
  $("modal").innerHTML=`
  <div class="row noprint"><button class="g" onclick="closeInv()">Close</button><button class="b" onclick="window.print()">Print / PDF</button></div>
  <div id="inv">
    <div style="display:flex;justify-content:space-between;gap:10px"><div><b style="font-size:20px">${esc(s.name)}</b><div style="white-space:pre-line;font-size:14px;color:#555">${esc(s.info)}</div></div>
    <div style="text-align:right"><b>Invoice #${pad(i.no)}</b><div style="font-size:14px;color:#555">${dstr(i.date)}</div></div></div>
    <p style="margin:14px 0 0"><span style="color:#555;font-size:14px">Billed to</span><br><b>${esc(i.cust)}</b>${i.phone?`<br><span style="font-size:14px;color:#555">${esc(i.phone)}</span>`:""}</p>
    <table><tr><th>Item</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Amount</th></tr>
    ${i.items.map(x=>`<tr><td>${esc(x.n)}${lineDesc(x)}</td><td class="n">${x.q}</td><td class="n">${fmt(x.p)}</td><td class="n">${fmt(x.p*x.q)}</td></tr>`).join("")}</table>
    <div class="s"><span>Subtotal</span><span>${fmt(i.sub)}</span></div>
    ${i.disc?`<div class="s"><span>Discount</span><span>−${fmt(i.disc)}</span></div>`:""}
    ${i.taxRate?`<div class="s"><span>Tax (${i.taxRate}%)</span><span>${fmt(i.tax)}</span></div>`:""}
    <div class="s" style="font-size:19px;font-weight:700;border-top:2px solid #111;margin-top:4px;padding-top:6px"><span>Total</span><span>${fmt(i.total)}</span></div>
    ${i.payments.length?`<div style="margin-top:12px;font-size:14px;color:#555">Payments received</div>`+i.payments.map((p,x)=>`<div class="s"><span>${dstr(p.date)} · ${esc(p.method)} <button class="noprint" style="border:0;background:none;color:#b91c1c" onclick="delPay(${i.no},${x})">✕</button></span><span>${fmt(p.amt)}</span></div>`).join("")+`<div class="s"><b>Total paid</b><b>${fmt(paid)}</b></div>`:""}
    <div class="s" style="font-size:19px;font-weight:700;border-top:2px solid #111;margin-top:6px;padding-top:6px;color:${b>0.005?"#b91c1c":"#0f766e"}"><span>${b>0.005?"Balance due":"Fully paid"}</span><span>${fmt(b)}</span></div>
    ${b>0.005&&i.due?`<div style="font-size:14px;margin-top:4px">Please pay by ${dstr(i.due)}</div>`:""}
    ${i.note?`<p style="margin:12px 0 0;font-size:14px">${esc(i.note)}</p>`:""}
    ${s.bank?`<p style="margin:12px 0 0;font-size:14px;white-space:pre-line;color:#555">Pay to:\n${esc(s.bank)}</p>`:""}
  </div>
  <div class="row wrap noprint">${b>0.005?`<button class="b" onclick="addPay(${no})">Add payment</button>`:""}<button class="g" onclick="shareInv(${no})">Share</button>${i.phone?`<button class="g" onclick="waInv(${no})">WhatsApp</button>`:""}</div>
  <div class="row noprint" style="margin-top:8px"><button class="g r" onclick="delInv(${no})">Delete invoice</button></div>`;
  $("modal").style.display="block";
}
function closeInv(){$("modal").style.display="none";render()}
async function addPay(no){
  const i=S.invoices.find(x=>x.no===no),b=balOf(i);
  const a=parseFloat(prompt(`Balance is ${fmt(b)}. Amount received now:`,b));
  if(isNaN(a)||a<=0)return;
  const m=prompt("Payment method (Cash, Transfer, Card…)","Cash");if(m===null)return;
  i.payments.push({amt:Math.min(a,b),date:new Date().toISOString(),method:m.trim()||"Cash"});
  await save();showInv(no);
}
async function delPay(no,x){
  if(!confirm("Remove this payment?"))return;
  S.invoices.find(v=>v.no===no).payments.splice(x,1);await save();showInv(no);
}
async function delInv(no){
  if(!confirm("Delete this invoice permanently? Stock will be returned."))return;
  const i=S.invoices.find(x=>x.no===no);
  i.items.forEach(it=>{const p=S.products.find(x=>x.id===it.id);if(p&&p.stock!=="")p.stock+=it.q*(it.u||1)});
  S.invoices=S.invoices.filter(x=>x.no!==no);await save();closeInv();
}
function invText(i){
  return `${S.settings.name}\nInvoice #${pad(i.no)} · ${dstr(i.date)}\nCustomer: ${i.cust}\n\n`+
    i.items.map(x=>`${x.n}${x.u>1?` [${x.unit} of ${x.u} pcs]`:""}  ${x.q} × ${fmt(x.p)} = ${fmt(x.p*x.q)}`).join("\n")+`\n\n`+
    (i.disc?`Discount: −${fmt(i.disc)}\n`:"")+(i.taxRate?`Tax (${i.taxRate}%): ${fmt(i.tax)}\n`:"")+
    `Total: ${fmt(i.total)}\nPaid: ${fmt(paidOf(i))}\n`+(balOf(i)>0.005?`Balance due: ${fmt(balOf(i))}`+(i.due?` by ${dstr(i.due)}`:"")+"\n":"Fully paid. Thank you!\n")+
    (S.settings.bank&&balOf(i)>0.005?`\nPay to:\n${S.settings.bank}`:"");
}
async function shareInv(no){
  const i=S.invoices.find(x=>x.no===no),text=invText(i);
  try{
    if(navigator.share)await navigator.share({title:`Invoice #${pad(i.no)}`,text});
    else{await navigator.clipboard.writeText(text);alert("Invoice text copied.")}
  }catch(e){}
}
function waInv(no){
  const i=S.invoices.find(x=>x.no===no);
  window.open("https://wa.me/"+i.phone.replace(/\D/g,"")+"?text="+encodeURIComponent(invText(i)),"_blank");
}

/* ---------- Backup / restore ---------- */
function backup(){
  const blob=new Blob([JSON.stringify({v:2,saved:new Date().toISOString(),products:S.products,invoices:S.invoices,settings:S.settings})],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="sales-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();
}
$("restore").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d.products)||!Array.isArray(d.invoices))throw 0;
    if(!confirm("This replaces all data on this phone with the backup. Continue?"))return;
    S.products=d.products.map(migP);S.invoices=d.invoices.map(mig);S.settings=Object.assign(S.settings,d.settings||{});
    await save();render();alert("Backup restored.");
  }catch(err){alert("That file is not a valid backup.")}
  e.target.value="";
};

/* ---------- Start ---------- */
(async()=>{
  S.products=(await DB.get("products",[])).map(migP);
  S.invoices=(await DB.get("invoices",[])).map(mig);
  S.settings=Object.assign(S.settings,await DB.get("settings",{}));
  render();
})();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
